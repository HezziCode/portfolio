<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hzFaviconBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="hzFaviconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Dark Slate Squircle Base -->
  <rect width="100" height="100" rx="24" fill="url(#hzFaviconBase)" />
  <rect x="1" y="1" width="98" height="98" rx="23" fill="none" stroke="url(#hzFaviconBorder)" stroke-width="2" />

  <!-- Huzaifa Sys "H" Monogram -->
  <!-- Left Pillar -->
  <rect x="23" y="23" width="13" height="54" rx="4.5" fill="#FFFFFF" />

  <!-- Right Pillar -->
  <rect x="64" y="23" width="13" height="54" rx="4.5" fill="#FFFFFF" />

  <!-- Crossbar -->
  <rect x="36" y="43" width="28" height="14" rx="2" fill="#FFFFFF" />

  <!-- Royal Blue Processing Core -->
  <circle cx="50" cy="50" r="8.5" fill="#2563EB" />
  <circle cx="50" cy="50" r="4.5" fill="#FFFFFF" />
  <circle cx="50" cy="50" r="1.8" fill="#0F172A" />
</svg>
